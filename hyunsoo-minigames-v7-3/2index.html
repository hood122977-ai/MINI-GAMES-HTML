<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클릭 타겟 : 훈련장 · 현수 미니게임</title><link rel="stylesheet" href="arcade.css"></head>
<body><nav><a href="index.html">← 게임 목록</a><strong>현수 미니게임</strong><span>AIM RANGE</span></nav><main><div class="heading"><div><h1>클릭 타겟 : 훈련장</h1><p class="subtitle">30초. 세 개의 표적. 정확하고 빠르게.</p></div><div class="stats"><div><label>점수</label><strong id="score">0</strong></div><div><label>정확도</label><strong id="extra">100%</strong></div><div><label>남은 시간</label><strong id="best">30.0 s</strong></div></div></div><div class="settings"><label for="mode">훈련 모드</label><select id="mode"><option value="grid">기본 · 3개 표적</option><option value="small">정밀 · 작은 표적</option><option value="moving">이동 · 움직이는 표적</option></select></div>
<div class="stage "><canvas id="game" width="960" height="540" tabindex="0" aria-label="클릭 타겟 : 훈련장 게임 화면"></canvas><div id="stage-note" class="stage-note"></div><div class="screen" id="overlay"><span class="eyebrow" id="eyebrow">AIM RANGE</span><h2 id="overlay-title">클릭 타겟 : 훈련장</h2><p id="overlay-body">표적을 맞히면 다른 위치에 새 표적이 생겨. 연속 명중은 추가 점수, 빗나가면 콤보가 끊겨. 모드를 고른 뒤 시작해.</p><button class="primary" id="play">시작하기</button></div></div>
<div class="bottom"><p>클릭 / 터치로 표적 맞히기 · <kbd>P</kbd> 일시 정지</p><div class="actions"><button id="pause">일시 정지</button><button id="restart">다시 시작</button><button id="sound" aria-pressed="false">소리 끔</button></div></div><div class="pad"></div><p class="footnote">화면을 벗어나면 자동으로 일시 정지돼. 기록은 이 브라우저에 저장돼.</p></main><script src="records.js"></script><script src="arcade.js"></script><script src="aim-range.js"></script></body></html>
