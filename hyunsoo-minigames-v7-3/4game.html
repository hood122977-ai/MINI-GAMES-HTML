<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지뢰찾기 · 현수 미니게임</title><link rel="stylesheet" href="arcade.css"></head><body><nav><a href="index.html">← 게임 목록</a><strong>현수 미니게임</strong><span>MINESWEEPER</span></nav><main><div class="heading"><div><h1>지뢰찾기</h1><p class="subtitle">깃발부터 꽂을까, 한 칸 더 열어 볼까.</p></div><div class="stats"><div><label>열린 칸</label><strong id="score">0 / 71</strong></div></div></div><div class="settings"><label for="difficulty">난이도</label><select id="difficulty"><option value="9,10">초급 · 9×9 · 지뢰 10개</option><option value="16,40">중급 · 16×16 · 지뢰 40개</option><option value="20,80">고급 · 20×20 · 지뢰 80개</option></select><button id="flag-mode" aria-pressed="false">깃발 모드 끔</button></div><div class="mine-scroll"><div class="mine-wrap"><div class="mine-head"><span id="mines" class="led" aria-label="남은 깃발">010</span><button class="face" id="face" aria-label="새 게임">🙂</button><span id="timer" class="led" aria-label="경과 시간">000</span></div><div id="mine-grid" class="mine-grid" aria-label="지뢰찾기 판"></div></div></div><p id="mine-status" role="status" style="text-align:center;font-size:13px;min-height:24px"></p><div class="bottom"><p>클릭: 열기 · 우클릭 / 길게 누르기: 깃발<br>숫자를 다시 누르면 주변 깃발 수가 맞을 때 남은 칸을 한 번에 열어.</p><div class="actions"><button id="pause">일시 정지</button><button id="restart">다시 시작</button><button id="sound" aria-pressed="false">소리 끔</button></div></div></main><script src="records.js"></script><script src="arcade.js"></script><script src="mines-classic.js"></script></body></html>
